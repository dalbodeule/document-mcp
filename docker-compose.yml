services:
  db:
    image: pgvector/pgvector:pg18-trixie
    container_name: document_mcp_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: document_mcp
    ports:
      - "5432:5432"
    volumes:
      - document_mcp_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d document_mcp"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  document_mcp_pgdata:

